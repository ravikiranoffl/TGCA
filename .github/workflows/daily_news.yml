name: The Gemini Chronicle Agent

on:
  schedule:
    # Evening archive run: 8:42 PM IST (15:12 UTC)
    - cron: '12 15 * * *'
    # Early refresh: 3:42 AM IST (22:12 UTC)
    - cron: '12 22 * * *'
  workflow_dispatch:

concurrency:
  group: tgca-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade google-genai beautifulsoup4 requests

      - name: Validate Python syntax
        run: python -m py_compile generate_news.py

      - name: Run News Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
        run: python generate_news.py

      - name: Commit and Push Updates
        run: |
          git config --local user.email "143505051+masterrkoffl@users.noreply.github.com"
          git config --local user.name "tgca-bot"
          YEAR=$(TZ=Asia/Kolkata date +'%Y')
          git add -- "$YEAR" email_body.html

          if ! git diff --cached --quiet; then
            git commit -m "GN$(TZ=Asia/Kolkata date +'%Y%m%d')A1" \
              -m "Co-authored-by: ravikiranoffl <171322216+ravikiranoffl@users.noreply.github.com>"
          else
            echo "No archive or email changes to commit."
          fi

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Get Formatted Date
        run: |
          export TZ='Asia/Kolkata'
          DAY=$(date +%-d)
          case $DAY in
            1|21|31) SUFFIX="st";;
            2|22)    SUFFIX="nd";;
            3|23)    SUFFIX="rd";;
            *)       SUFFIX="th";;
          esac
          MONTH_YEAR=$(date +'%B %Y')
          echo "NOW=${DAY}${SUFFIX} ${MONTH_YEAR}" >> "$GITHUB_ENV"

      - name: Send Breaking News Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Breaking News: ${{ env.NOW }}"
          to: ${{ secrets.GMAIL_USER }}
          from: "The Gemini Chronicle Agent"
          html_body: file://email_body.html
